<!DOCTYPE html>  <html lang="en">  
<head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">  
  <title>RIVANSHH - Audio Playground</title>  
  <link rel="preconnect" href="https://fonts.googleapis.com">  
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">    <style>  
    :root {  
      --bg-base: #060913;  
      --bg-card: rgba(15, 23, 42, 0.85);  
      --accent-blue: #3b82f6;  
      --accent-cyan: #06b6d4;  
      --accent-glow: rgba(59, 130, 246, 0.4);  
      --text-main: #f8fafc;  
      --text-muted: #94a3b8;  
      --border-line: rgba(255, 255, 255, 0.08);  
    }  
  
    * {  
      box-sizing: border-box;  
      margin: 0;  
      padding: 0;  
      font-family: 'Plus Jakarta Sans', sans-serif;  
      -webkit-tap-highlight-color: transparent;  
    }  
  
    body {  
      background-color: var(--bg-base);  
      color: var(--text-main);  
      min-height: 100vh;  
      display: flex;  
      flex-direction: column;  
      overflow-x: hidden;  
      padding-bottom: 95px;  
    }  
  
    /* Top Bar */  
    header {  
      padding: 16px 20px;  
      display: flex;  
      justify-content: space-between;  
      align-items: center;  
      border-bottom: 1px solid var(--border-line);  
      background: rgba(6, 9, 19, 0.95);  
      backdrop-filter: blur(12px);  
      position: sticky;  
      top: 0;  
      z-index: 50;  
    }  
  
    .brand-logo {  
      display: flex;  
      align-items: center;  
      gap: 10px;  
    }  
  
    .brand-logo i {  
      font-size: 22px;  
      color: var(--accent-cyan);  
      filter: drop-shadow(0 0 10px var(--accent-cyan));  
    }  
  
    .brand-logo h1 {  
      font-size: 19px;  
      font-weight: 700;  
      letter-spacing: 1.5px;  
      background: linear-gradient(135deg, #60a5fa, #22d3ee);  
      -webkit-background-clip: text;  
      -webkit-text-fill-color: transparent;  
    }  
  
    .profile-pill {  
      display: flex;  
      align-items: center;  
      gap: 8px;  
      background: var(--bg-card);  
      border: 1px solid var(--border-line);  
      padding: 6px 14px;  
      border-radius: 20px;  
      font-size: 12px;  
      font-weight: 600;  
      color: #38bdf8;  
    }  
  
    /* Container */  
    .container {  
      padding: 18px 20px;  
      max-width: 520px;  
      margin: 0 auto;  
      width: 100%;  
    }  
  
    /* Search Bar */  
    .search-box {  
      display: flex;  
      gap: 10px;  
      background: var(--bg-card);  
      border: 1px solid var(--border-line);  
      padding: 8px 14px;  
      border-radius: 14px;  
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);  
      margin-bottom: 20px;  
      align-items: center;  
    }  
  
    .search-box input {  
      flex: 1;  
      background: transparent;  
      border: none;  
      outline: none;  
      color: #fff;  
      font-size: 14px;  
    }  
  
    .search-box input::placeholder {  
      color: #64748b;  
    }  
  
    .search-btn {  
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));  
      border: none;  
      width: 38px;  
      height: 38px;  
      border-radius: 10px;  
      color: white;  
      cursor: pointer;  
      display: flex;  
      align-items: center;  
      justify-content: center;  
      box-shadow: 0 0 12px var(--accent-glow);  
    }  
  
    /* Music Player Card */  
    .player-card {  
      background: var(--bg-card);  
      border: 1px solid var(--border-line);  
      border-radius: 20px;  
      padding: 18px;  
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);  
      margin-bottom: 24px;  
      text-align: center;  
    }  
  
    .art-frame {  
      width: 180px;  
      height: 180px;  
      margin: 0 auto 16px;  
      border-radius: 18px;  
      overflow: hidden;  
      border: 2px solid rgba(59, 130, 246, 0.3);  
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.2);  
      background: #0f172a;  
    }  
  
    .art-frame img {  
      width: 100%;  
      height: 100%;  
      object-fit: cover;  
    }  
  
    .meta-title {  
      font-size: 16px;  
      font-weight: 700;  
      white-space: nowrap;  
      overflow: hidden;  
      text-overflow: ellipsis;  
      margin-bottom: 4px;  
    }  
  
    .meta-artist {  
      font-size: 13px;  
      color: var(--text-muted);  
      margin-bottom: 16px;  
    }  
  
    /* Custom Player Controls */  
    .progress-bar-wrap {  
      width: 100%;  
      display: flex;  
      align-items: center;  
      gap: 10px;  
      margin-bottom: 16px;  
    }  
  
    .time-stamp {  
      font-size: 11px;  
      color: var(--text-muted);  
      min-width: 32px;  
    }  
  
    .progress-slider {  
      flex: 1;  
      height: 5px;  
      appearance: none;  
      -webkit-appearance: none;  
      background: #1e293b;  
      border-radius: 5px;  
      outline: none;  
    }  
  
    .progress-slider::-webkit-slider-thumb {  
      appearance: none;  
      -webkit-appearance: none;  
      width: 14px;  
      height: 14px;  
      border-radius: 50%;  
      background: var(--accent-cyan);  
      box-shadow: 0 0 10px var(--accent-cyan);  
      cursor: pointer;  
    }  
  
    .control-buttons {  
      display: flex;  
      justify-content: center;  
      align-items: center;  
      gap: 24px;  
      margin-bottom: 14px;  
    }  
  
    .btn-circle {  
      background: transparent;  
      border: none;  
      color: var(--text-muted);  
      font-size: 20px;  
      cursor: pointer;  
    }  
  
    .btn-play-pause {  
      width: 54px;  
      height: 54px;  
      border-radius: 50%;  
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));  
      border: none;  
      color: #fff;  
      font-size: 20px;  
      display: flex;  
      align-items: center;  
      justify-content: center;  
      box-shadow: 0 0 16px var(--accent-glow);  
      cursor: pointer;  
    }  
  
    .btn-download {  
      display: inline-flex;  
      align-items: center;  
      gap: 8px;  
      padding: 8px 18px;  
      background: rgba(59, 130, 246, 0.15);  
      border: 1px solid var(--accent-blue);  
      border-radius: 20px;  
      color: #60a5fa;  
      font-size: 12px;  
      font-weight: 600;  
      text-decoration: none;  
      cursor: pointer;  
      transition: all 0.2s;  
    }  
  
    .btn-download:active {  
      transform: scale(0.96);  
      background: var(--accent-blue);  
      color: #fff;  
    }  
  
    /* Song Results Section */  
    .section-title {  
      font-size: 13px;  
      text-transform: uppercase;  
      letter-spacing: 1px;  
      color: var(--text-muted);  
      margin-bottom: 12px;  
      font-weight: 700;  
    }  
  
    .track-list {  
      display: flex;  
      flex-direction: column;  
      gap: 10px;  
    }  
  
    .track-row {  
      display: flex;  
      align-items: center;  
      gap: 12px;  
      background: rgba(15, 23, 42, 0.5);  
      padding: 10px 14px;  
      border-radius: 12px;  
      border: 1px solid var(--border-line);  
      cursor: pointer;  
      transition: all 0.2s ease;  
    }  
  
    .track-row:active {  
      transform: scale(0.98);  
      background: rgba(59, 130, 246, 0.15);  
      border-color: var(--accent-blue);  
    }  
  
    .row-thumb {  
      width: 44px;  
      height: 44px;  
      border-radius: 8px;  
      object-fit: cover;  
      background: #1e293b;  
    }  
  
    .row-info {  
      flex: 1;  
      overflow: hidden;  
    }  
  
    .row-title {  
      font-size: 13px;  
      font-weight: 600;  
      white-space: nowrap;  
      overflow: hidden;  
      text-overflow: ellipsis;  
    }  
  
    .row-sub {  
      font-size: 11px;  
      color: var(--text-muted);  
    }  
  
    /* Bottom Navigation */  
    .bottom-nav {  
      position: fixed;  
      bottom: 0;  
      left: 0;  
      right: 0;  
      height: 65px;  
      background: rgba(6, 9, 19, 0.95);  
      backdrop-filter: blur(15px);  
      border-top: 1px solid var(--border-line);  
      display: flex;  
      justify-content: space-around;  
      align-items: center;  
      z-index: 100;  
    }  
  
    .nav-link {  
      display: flex;  
      flex-direction: column;  
      align-items: center;  
      gap: 4px;  
      color: var(--text-muted);  
      font-size: 11px;  
      font-weight: 600;  
    }  
  
    .nav-link.active {  
      color: var(--accent-cyan);  
    }  
  
    .nav-link i {  
      font-size: 18px;  
    }  
  </style>  </head>  
<body>    <!-- Top Navigation Header -->    <header>  
    <div class="brand-logo">  
      <i class="fa-solid fa-bolt"></i>  
      <h1>RIVANSHH</h1>  
    </div>  
    <div class="profile-pill">  
      <i class="fa-solid fa-user-astronaut"></i>  
      <span>Abhivansh</span>  
    </div>  
  </header>    <div class="container">  
    <!-- Music Search Box -->  
    <div class="search-box">  
      <input type="text" id="searchInput" placeholder="Search track or artist name...">  
      <button class="search-btn" id="searchBtn">  
        <i class="fa-solid fa-magnifying-glass"></i>  
      </button>  
    </div>  <!-- Active Now Playing Card -->  
<div class="player-card">  
  <div class="art-frame">  
    <img id="playerArt" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500" alt="Cover Art">  
  </div>  

  <div class="meta-title" id="playerTitle">Arijit - Kesariya</div>  
  <div class="meta-artist" id="playerArtist">Brahmastra • Cloud Source</div>  

  <div class="progress-bar-wrap">  
    <span class="time-stamp" id="currentTime">0:00</span>  
    <input type="range" class="progress-slider" id="seekBar" value="0" min="0" max="100">  
    <span class="time-stamp" id="durationTime">0:00</span>  
  </div>  

  <div class="control-buttons">  
    <button class="btn-circle" onclick="seekRelative(-10)"><i class="fa-solid fa-rotate-left"></i></button>  
    <button class="btn-play-pause" id="playPauseBtn"><i class="fa-solid fa-play" id="playIcon"></i></button>  
    <button class="btn-circle" onclick="seekRelative(10)"><i class="fa-solid fa-rotate-right"></i></button>  
  </div>  

  <div>  
    <a id="downloadLink" href="#" download="music.mp3" class="btn-download" target="_blank">  
      <i class="fa-solid fa-circle-down"></i> Download MP3  
    </a>  
  </div>  
</div>  

<!-- Hidden Native Audio Engine for Background Playback -->  
<audio id="audioEngine" preload="metadata"></audio>  

<!-- Track List Area -->  
<div class="section-title" id="listTitle">Popular Hits (Tap to Play)</div>  
<div class="track-list" id="trackListContainer"></div>

  </div>    <!-- Bottom Navigation Bar -->    <nav class="bottom-nav">  
    <div class="nav-link active">  
      <i class="fa-solid fa-house"></i>  
      <span>Home</span>  
    </div>  
    <div class="nav-link">  
      <i class="fa-solid fa-compass"></i>  
      <span>Explore</span>  
    </div>  
    <div class="nav-link">  
      <i class="fa-solid fa-layer-group"></i>  
      <span>Library</span>  
    </div>  
    <div class="nav-link">  
      <i class="fa-solid fa-gear"></i>  
      <span>Settings</span>  
    </div>  
  </nav>    <script>  
    // Audio engine & UI elements  
    const audio = document.getElementById('audioEngine');  
    const playPauseBtn = document.getElementById('playPauseBtn');  
    const playIcon = document.getElementById('playIcon');  
    const playerTitle = document.getElementById('playerTitle');  
    const playerArtist = document.getElementById('playerArtist');  
    const playerArt = document.getElementById('playerArt');  
    const downloadLink = document.getElementById('downloadLink');  
    const seekBar = document.getElementById('seekBar');  
    const currentTimeEl = document.getElementById('currentTime');  
    const durationTimeEl = document.getElementById('durationTime');  
    const searchInput = document.getElementById('searchInput');  
    const searchBtn = document.getElementById('searchBtn');  
    const trackListContainer = document.getElementById('trackListContainer');  
  
    // Built-in working songs with direct cross-origin audio links (never blocked)  
    const initialHits = [  
      {  
        title: "Lofi Study Night",  
        artist: "ChillHop Beats",  
        art: "https://images.unsplash.com/photo-1518609878373-06d740f60d8b?w=400",  
        url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"  
      },  
      {  
        title: "Synthwave Sunset",  
        artist: "Retro Wave",  
        art: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=400",  
        url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"  
      },  
      {  
        title: "Acoustic Breeze",  
        artist: "Indie Soul",  
        art: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400",  
        url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"  
      }  
    ];  
  
    function formatTime(secs) {  
      if (isNaN(secs)) return "0:00";  
      const m = Math.floor(secs / 60);  
      const s = Math.floor(secs % 60);  
      return `${m}:${s < 10 ? '0' : ''}${s}`;  
    }  
  
    function playTrack(item) {  
      playerTitle.innerText = item.title;  
      playerArtist.innerText = item.artist;  
      playerArt.src = item.art;  
      downloadLink.href = item.url;  
      downloadLink.setAttribute('download', `${item.title}.mp3`);  
  
      audio.src = item.url;  
      audio.play().then(() => {  
        playIcon.className = "fa-solid fa-pause";  
      }).catch(err => {  
        console.log("Audio play error: ", err);  
      });  
  
      // System Notification & Lock-Screen Integration (Spotify Style)  
      if ('mediaSession' in navigator) {  
        navigator.mediaSession.metadata = new MediaMetadata({  
          title: item.title,  
          artist: item.artist,  
          album: 'RIVANSHH Music',  
          artwork: [{ src: item.art, sizes: '512x512', type: 'image/jpeg' }]  
        });  
  
        navigator.mediaSession.setActionHandler('play', () => {  
          audio.play();  
          playIcon.className = "fa-solid fa-pause";  
        });  
        navigator.mediaSession.setActionHandler('pause', () => {  
          audio.pause();  
          playIcon.className = "fa-solid fa-play";  
        });  
        navigator.mediaSession.setActionHandler('seekbackward', () => seekRelative(-10));  
        navigator.mediaSession.setActionHandler('seekforward', () => seekRelative(10));  
      }  
    }  
  
    function renderList(list) {  
      trackListContainer.innerHTML = '';  
      list.forEach(song => {  
        const row = document.createElement('div');  
        row.className = 'track-row';  
        row.innerHTML = `  
          <img class="row-thumb" src="${song.art}" alt="Cover" onerror="this.src='https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100'">  
          <div class="row-info">  
            <div class="row-title">${song.title}</div>  
            <div class="row-sub">${song.artist}</div>  
          </div>  
          <i class="fa-solid fa-circle-play" style="color: var(--accent-cyan); font-size: 22px;"></i>  
        `;  
        row.onclick = () => playTrack(song);  
        trackListContainer.appendChild(row);  
      });  
    }  
  
    // Live search engine using direct iTunes CDN (Zero CORS error on phone)  
    async function searchTracks(query) {  
      if (!query.trim()) return;  
      trackListContainer.innerHTML = '<p style="text-align:center; color: var(--accent-cyan); padding: 15px;">Searching songs...</p>';  
        
      try {  
        const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=15`);  
        const data = await res.json();  
          
        if (data.results && data.results.length > 0) {  
          const songs = data.results.map(item => ({  
            title: item.trackName,  
            artist: item.artistName,  
            art: item.artworkUrl100.replace('100x100bb', '400x400bb'),  
            url: item.previewUrl  
          }));  
          renderList(songs);  
          document.getElementById('listTitle').innerText = `Results for "${query}"`;  
        } else {  
          trackListContainer.innerHTML = '<p style="text-align:center; color: var(--text-muted); padding: 15px;">Koi song nahi mila!</p>';  
        }  
      } catch (e) {  
        trackListContainer.innerHTML = '<p style="text-align:center; color: #ef4444; padding: 15px;">Error fetching tracks. Check connection.</p>';  
      }  
    }  
  
    // Play / Pause Toggle  
    playPauseBtn.addEventListener('click', () => {  
      if (audio.paused) {  
        audio.play();  
        playIcon.className = "fa-solid fa-pause";  
      } else {  
        audio.pause();  
        playIcon.className = "fa-solid fa-play";  
      }  
    });  
  
    // Update Seek Bar & Duration  
    audio.addEventListener('timeupdate', () => {  
      if (!isNaN(audio.duration)) {  
        const progress = (audio.currentTime / audio.duration) * 100;  
        seekBar.value = progress;  
        currentTimeEl.innerText = formatTime(audio.currentTime);  
        durationTimeEl.innerText = formatTime(audio.duration);  
      }  
    });  
  
    seekBar.addEventListener('input', () => {  
      if (!isNaN(audio.duration)) {  
        audio.currentTime = (seekBar.value / 100) * audio.duration;  
      }  
    });  
  
    function seekRelative(seconds) {  
      audio.currentTime = Math.min(Math.max(audio.currentTime + seconds, 0), audio.duration || 0);  
    }  
  
    // Search events  
    searchBtn.addEventListener('click', () => searchTracks(searchInput.value));  
    searchInput.addEventListener('keypress', (e) => {  
      if (e.key === 'Enter') searchTracks(searchInput.value);  
    });  
  
    // Load initial songs & first track  
    renderList(initialHits);  
    playTrack(initialHits[0]);  
    audio.pause(); // Initial state paused  
  </script>  </body>  
</html>
